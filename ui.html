<!doctype html>
<html lang="ru" data-theme="xrock">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Xray">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/favicon.png">
<title>Xray Selector</title>
<style>
@font-face{font-family:XFlags;src:url(/flags.ttf) format("truetype");unicode-range:U+1F1E6-1F1FF;font-display:swap}
/* ---------- темы ---------- */
:root,[data-theme=xrock]{
  --bg:#07070d;--bg2:#0b0b14;--card:#0f0f19;--card2:#151524;--line:#1e1e30;--line2:#2b2b44;
  --text:#e8e8f2;--muted:#8d8da8;--dim:#5d5d78;
  --acc:#a78bfa;--acc2:#22d3ee;--good:#34d399;--mid:#fbbf24;--bad:#f87171;--orange:#fb923c;
  --grad:linear-gradient(90deg,#8b5cf6,#22d3ee);--okbg:rgba(52,211,153,.08);--okline:rgba(52,211,153,.35);
  --r:16px;--r2:11px;--shadow:0 10px 30px rgba(0,0,0,.35);--blur:none;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
[data-theme=unifi]{
  --bg:#131417;--bg2:#16171a;--card:#1b1c20;--card2:#222328;--line:#2b2d33;--line2:#3a3d45;
  --text:#f2f3f5;--muted:#9a9ea8;--dim:#6b6f78;--acc:#3d8bff;--acc2:#3d8bff;--good:#29c76f;--mid:#f5a524;--bad:#f0524f;
  --grad:linear-gradient(90deg,#006fff,#3d8bff);--okbg:rgba(41,199,111,.08);--okline:rgba(41,199,111,.3);--r:10px;--r2:7px;--shadow:none
}
[data-theme=srm]{
  --bg:#e9eef4;--bg2:#f3f6f9;--card:#ffffff;--card2:#f5f7fa;--line:#dde3ea;--line2:#c9d3dd;
  --text:#2b3440;--muted:#66727f;--dim:#97a3af;--acc:#0b7fd9;--acc2:#0ea5c6;--good:#2aa84a;--mid:#d98a00;--bad:#e0453e;--orange:#e7791b;
  --grad:linear-gradient(90deg,#0b7fd9,#36a3f5);--okbg:#ecf9ef;--okline:#b9e4c3;--r:8px;--r2:5px;--shadow:0 6px 18px rgba(15,40,70,.10)
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14px/1.45 XFlags,Inter,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
.mono,.num{font-family:XFlags,var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--acc)}
button,select,input,textarea{font:inherit;color:var(--text)}
/* фон с «живыми» пятнами (только полные эффекты) */
#bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;display:none}
.fx #bgfx{display:block}
#bgfx i{position:absolute;width:55vw;height:55vw;border-radius:50%;filter:blur(90px);opacity:.16;animation:drift 26s ease-in-out infinite alternate}
#bgfx i:nth-child(1){background:#7c3aed;left:-15vw;top:-20vw}
#bgfx i:nth-child(2){background:#06b6d4;right:-18vw;top:5vw;animation-duration:32s}
#bgfx i:nth-child(3){background:#10b981;left:20vw;bottom:-30vw;opacity:.08;animation-duration:38s}
[data-theme=srm] #bgfx i{opacity:.12}
@keyframes drift{to{transform:translate(8vw,6vw) scale(1.15)}}
/* ---------- каркас ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 12px;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:700;font-size:16px}
.brand img{width:30px;height:30px;border-radius:8px}
.brand small{font-weight:600;font-size:10.5px;padding:2px 6px;border-radius:99px;background:rgba(167,139,250,.16);color:var(--acc);margin-left:auto}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r2);color:var(--muted);text-decoration:none;cursor:pointer;position:relative;transition:background .15s,color .15s}
.nav a:hover{background:var(--card2);color:var(--text)}
.nav a.on{background:var(--card2);color:var(--text);font-weight:600}
.nav a.on:before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--grad)}
.nav .ic{width:20px;text-align:center;font-size:15px}
.nav .badge{margin-left:auto;font-size:11px;min-width:18px;padding:1px 6px;border-radius:99px;background:var(--bad);color:#fff;text-align:center}
.side .sp{flex:1}
.sidefoot{font-size:11.5px;color:var(--dim);padding:8px 10px;line-height:1.6}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 26px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top h1{margin:0;font-size:18px;font-weight:650;letter-spacing:-.2px}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:5px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.dot.live{animation:pulse 2.2s infinite}
.dot.bad{background:var(--bad)}.dot.mid{background:var(--mid)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--card);border-radius:var(--r2);padding:7px 13px;font-size:13px;cursor:pointer;color:var(--text);text-decoration:none;white-space:nowrap;transition:transform .12s,background .15s,border-color .15s}
.btn:hover{background:var(--card2);border-color:var(--acc)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);border:0;color:#fff;font-weight:600}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.icon{padding:7px 9px}
.btn:disabled{opacity:.5;cursor:default}
.subtabs{padding:10px 26px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.subtabs .seg{flex-wrap:nowrap}.subtabs .seg button{font-size:13.5px;padding:6px 14px;white-space:nowrap}
.subtabs .bdg{background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
.demobar{margin:10px 26px 0;padding:10px 14px;border-radius:var(--r2);background:#facc15;color:#1a1400;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.updbar{margin:10px 26px 0;padding:14px 16px;border-radius:var(--r2);border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);background:color-mix(in srgb,var(--acc) 12%,var(--bg2))}
.updbar h3{margin:0 0 6px;font-size:16px}
.updbar .notes{white-space:pre-wrap;font-size:13px;max-height:180px;overflow:auto;opacity:.9;margin:6px 0 10px}
.demobar .btn{background:#1a1400;color:#facc15;border-color:#1a1400}
.qhelp{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);font-size:11px;color:var(--muted);cursor:help;margin-left:5px;vertical-align:1px}
.xcfg{width:100%;min-height:52vh;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre;tab-size:2}
.svc-g{margin:10px 0 4px}.svc-h{margin-bottom:6px}.svc-l{display:flex;flex-wrap:wrap;gap:6px 14px}
.svc-i{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer;padding:3px 0}.svc-i input{accent-color:#8b5cf6;width:16px;height:16px}
.modecard{display:block;border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;cursor:pointer;background:var(--card)}
.modecard input{display:none}.modecard.on{border-color:#8b5cf6;box-shadow:inset 0 0 0 1px #8b5cf6}.modecard b{display:block;margin-bottom:4px}
.wg{margin-bottom:2px}
.wgh{display:flex;align-items:center;gap:6px;margin:0 2px 6px;font-size:12.5px}
.wgh .wgt{color:var(--muted);font-weight:600;cursor:pointer;user-select:none}.wgh .sp{flex:1}
.wgh button{border:1px solid var(--line2);background:var(--card2);color:var(--text);border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer;opacity:.85}
.wgh button:hover{opacity:1;border-color:#8b5cf6}
.wg.col .wgh{padding:10px 14px;border:1px solid var(--line);border-radius:var(--r2);background:var(--card);margin-bottom:14px}
.wgrow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-top:1px solid var(--line)}.wgrow .drag{cursor:grab;color:var(--muted)}
body.simple .x-exp{display:none!important}
.hbars{display:flex;align-items:flex-end;gap:2px;height:46px}.hbars i{flex:1;border-radius:2px 2px 0 0;min-height:2px}
.wizard{z-index:60}.wzcard{width:min(860px,calc(100vw - 20px));max-height:calc(100vh - 30px);overflow:auto}
.wzsteps{display:flex;gap:4px;flex-wrap:wrap;font-size:12px}.wzsteps span{padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.wzsteps span.on{border-color:#8b5cf6;color:var(--text);background:rgba(139,92,246,.15)}.wzsteps span.done{color:var(--good)}
.modecard.pend{border-style:dashed}
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:40;width:min(980px,calc(100vw - 24px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r2);background:var(--card2);border:1px solid #8b5cf6;box-shadow:0 10px 30px rgba(0,0,0,.45)}
@media (max-width:900px){.savebar{bottom:calc(76px + env(safe-area-inset-bottom))}}
.tsec{cursor:pointer;user-select:none}.tsec:hover td{color:var(--text)}.tsec .tarr{display:inline-block;width:14px}
.svcl{font-size:11.5px;font-weight:700;color:var(--muted);margin:0 2px 0 0;align-self:center;white-space:nowrap}.svcbr{flex-basis:100%;height:2px}
.rx{font-style:italic}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--card2);border:1px solid var(--line2);border-radius:var(--r2);box-shadow:0 10px 30px rgba(0,0,0,.4);max-height:340px;overflow:auto}
.card:has(.lgqwrap){overflow:visible}
.sugi{padding:8px 12px;cursor:pointer}.sugi:hover{background:rgba(139,92,246,.15)}
.sugc{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}.sugc button{border:1px solid var(--line2);background:var(--card);color:var(--text);border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer}
/* 0.9: окно мастера — шаги и кнопки всегда видны, прокручивается только середина */
.wizard .wzcard{display:flex;flex-direction:column;overflow:hidden;max-height:calc(100vh - 30px)}
.wizard .wzbody{overflow:auto;flex:1;min-height:0;padding-right:4px}
.wizard .wzfoot{border-top:1px solid var(--line);padding-top:12px;margin-top:10px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:calc(var(--r2) - 3px);font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15)}
[data-theme=xrock] .seg button.on{background:rgba(167,139,250,.14);color:#e7dfff;box-shadow:inset 0 0 0 1px rgba(167,139,250,.45)}
.bell{position:relative}
.bell b{position:absolute;top:-5px;right:-5px;font-size:10px;min-width:16px;height:16px;line-height:16px;border-radius:99px;background:var(--bad);color:#fff;text-align:center;padding:0 4px}
.page{padding:20px 26px 40px;display:none;gap:16px;align-content:start}
.page.on{display:grid;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
/* ---------- карточки ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.fx .card.glass{background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--acc);display:flex;align-items:center;gap:8px}
[data-theme=srm] .card h3,[data-theme=unifi] .card h3{color:var(--muted)}
.card h3 .r{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px}
.card h3 .r.mono{color:var(--acc2)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.ghero{grid-template-columns:1.35fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.tilt{transition:transform .2s ease;transform-style:preserve-3d;will-change:transform}
/* статус-баннер */
.status{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:var(--r);border:1px solid var(--okline);background:var(--okbg)}
.status .dot{width:12px;height:12px}
.status h2{margin:0;font-size:17px;color:var(--good);font-weight:650}
.status.warn{border-color:color-mix(in srgb,var(--mid) 40%,transparent);background:color-mix(in srgb,var(--mid) 8%,transparent)}.status.warn h2{color:var(--mid)}
.status.bad{border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent)}.status.bad h2{color:var(--bad)}
.status p{margin:2px 0 0;color:var(--muted);font-size:13px}
.status .r{margin-left:auto;text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--muted);line-height:1.6}
/* метрики с графиком внизу */
.met{padding:14px 16px 0;min-height:118px;display:flex;flex-direction:column}
.met .lab{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.met .val{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.5px;margin-top:4px}
.met .val small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.met .sub{font-size:11.5px;color:var(--muted);margin-top:2px;position:relative;z-index:1}
.met svg{display:block;width:calc(100% + 32px);margin:auto -16px 0;height:42px}
/* герой: текущий сервер */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.hero .flag{font-size:52px;line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.hero .nm{font-size:26px;font-weight:700;letter-spacing:-.4px}
.hero .nm span{color:var(--muted);font-weight:500;font-size:16px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.tag.g{background:color-mix(in srgb,var(--good) 13%,transparent);color:var(--good);border-color:transparent}
.tag.a{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc);border-color:transparent}
.tag.m{background:color-mix(in srgb,var(--mid) 14%,transparent);color:var(--mid);border-color:transparent}
.tag.b{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad);border-color:transparent}
.ring{position:relative;width:86px;height:86px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:24px}
.ring small{position:absolute;bottom:-17px;width:100%;text-align:center;font-size:11px;color:var(--muted)}
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.svc div{background:var(--card2);border:1px solid var(--line);border-radius:var(--r2);padding:8px 10px}
.svc span{display:block;font-size:11.5px;color:var(--muted)}
.svc strong{font-family:var(--mono);font-size:14px}
.g{color:var(--good)}.m{color:var(--mid)}.b{color:var(--bad)}.n{color:var(--dim)}
/* полоски */
.bar{display:flex;gap:2px;height:9px;align-items:stretch}
.bar i{flex:1;border-radius:2px;background:var(--good);opacity:.9;min-width:2px}
.bar i.x{background:var(--bad)}.bar i.e{background:var(--line)}.bar i.y{background:var(--mid)}
.prog{height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .6s ease}
/* таблицы */
table.t{width:100%;border-collapse:collapse}
.t th{font-size:11.5px;font-weight:500;color:var(--dim);text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.act td{background:color-mix(in srgb,var(--acc) 9%,transparent)}
.t tr:hover td{background:var(--card2)}
.t .sec td{padding:12px 9px 6px;color:var(--muted);font-size:12px;background:transparent!important;border-bottom:0}
.chk{display:flex;gap:4px;flex-wrap:wrap}
.ck{font-size:11px;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--good) 11%,transparent);color:var(--good);white-space:nowrap;font-family:var(--mono)}
.ck.x{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}.ck.w{background:var(--card2);color:var(--dim)}
.sc{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-weight:700;font-size:13px}
.sc s{display:inline-block;width:42px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;text-decoration:none}.sc s u{display:block;height:100%}
.ib{width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);background:var(--card2);display:inline-grid;place-items:center;color:var(--muted);font:italic 700 13px Georgia,serif;cursor:pointer;flex:none}
.ib:hover{color:var(--acc);border-color:var(--acc)}
.mini{display:flex;gap:6px}
.mini button{border:1px solid var(--line2);background:var(--card2);border-radius:8px;width:34px;height:34px;cursor:pointer;color:var(--text);font-size:15px}
button.ib[data-dopen]{width:34px;height:34px;border-radius:8px;border:1px solid #8b5cf6;background:rgba(139,92,246,.18);color:var(--text);font-size:15px!important;cursor:pointer}
button.ib[data-dopen]:hover{background:rgba(139,92,246,.32)}
.mini button:hover{color:var(--text);border-color:var(--acc)}
.mini button:disabled{opacity:.3}
/* плитки серверов */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:10px}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:var(--r2);padding:10px 11px;cursor:pointer;transition:border-color .15s,transform .15s;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile:hover{border-color:var(--line2);transform:translateY(-1px)}
.tile.sel{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.tile .tr{display:flex;align-items:center;gap:6px;min-width:0}
.tile .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tile .mt{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.tile .dl{font-family:var(--mono);font-weight:600;cursor:pointer;padding:0 4px;border-radius:4px}
.tile .dl:hover{background:var(--line)}
.ico{cursor:pointer;opacity:.55;font-size:13px;padding:0 2px}.ico:hover{opacity:1}.ico.on{opacity:1;color:#eab308}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--muted)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .sp{flex:1}
input.in,select.in,textarea.in{background:var(--card2);border:1px solid var(--line2);border-radius:var(--r2);padding:7px 10px;min-width:0;outline:none}
input.in:focus,textarea.in:focus,select.in:focus{border-color:var(--acc)}
textarea.in{width:100%;min-height:120px;font-family:var(--mono);font-size:12.5px}
.note{font-size:12.5px;color:var(--muted)}
.banner{border:1px solid color-mix(in srgb,var(--mid) 40%,transparent);background:color-mix(in srgb,var(--mid) 9%,transparent);border-radius:var(--r2);padding:10px 12px;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:26px}
/* журнал */
.log{font:12px/1.65 var(--mono);white-space:pre;overflow:auto;max-height:520px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;color:var(--muted)}
.log .lv{color:var(--acc)}.log .ld{color:var(--dim)}.log .lb{color:var(--bad)}.log .le{color:var(--mid)}.log .dv{color:var(--acc2)}
.log mark{background:color-mix(in srgb,var(--acc) 35%,transparent);color:var(--text);border-radius:3px}
/* события */
.ev{display:grid;grid-template-columns:62px 22px 1fr;gap:8px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.ev .tm{font-family:var(--mono);color:var(--dim);font-size:12px}
.ev.unread{background:color-mix(in srgb,var(--acc) 6%,transparent)}
/* правая панель «i» */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);z-index:60;background:var(--card);border-left:1px solid var(--line2);box-shadow:-24px 0 60px rgba(0,0,0,.45);transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.fx .drawer{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.drawer .dh{display:flex;gap:12px;align-items:center;padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.drawer .db{padding:14px 18px 30px;overflow:auto;display:grid;gap:12px;align-content:start}
.shade{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.shade.on{opacity:1;pointer-events:auto}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kv div{background:var(--card2);border:1px solid var(--line);border-radius:var(--r2);padding:8px 10px}
.kv span{display:block;font-size:11.5px;color:var(--muted)}.kv b{font-family:var(--mono);font-size:15px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border-bottom:0}
/* карта соединений */
.flow{position:relative;width:100%;height:520px}
.flow canvas{position:absolute;inset:0;width:100%;height:100%}
.flowlbl{position:absolute;font-size:12.5px;white-space:nowrap;pointer-events:none;line-height:1.25}
.flowlbl b{font-weight:600}.flowlbl small{display:block;color:var(--muted);font-size:11px;font-family:var(--mono)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#111;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:90vw;font-size:13.5px}
.toast.on{opacity:.96;transform:translate(-50%,0)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}
@keyframes r{to{transform:rotate(360deg)}}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:13px}
.sw input{display:none}
.sw .k{width:38px;height:22px;border-radius:99px;background:var(--line2);position:relative;transition:.2s;flex:none}
.sw .k:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+.k{background:var(--good)}.sw input:checked+.k:after{left:19px}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fg label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.fg label.full{grid-column:1/-1}
.lnk{cursor:pointer;color:var(--acc)}
.thx{display:block;margin:8px 10px;padding:9px 12px;border-radius:10px;font-size:13px;text-align:center;text-decoration:none;color:#fff;background:linear-gradient(135deg,#f15f2c,#e8436b)}
.thx:hover{filter:brightness(1.08)}
.thxb{color:#e8436b}
/* ---------- мобильная раскладка ---------- */
.tabbar{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
  .top .hide-m{display:none}
  .subtabs{padding:8px 12px 0}.demobar{margin:8px 12px 0}.updbar{margin:8px 12px 0}
  .page{padding:14px 12px calc(84px + env(safe-area-inset-bottom))}
  .g2,.g3,.ghero{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}
  .flowlbl{font-size:11px}.flowlbl small{display:none}
  .svc{grid-template-columns:1fr 1fr}
  .hero{grid-template-columns:auto 1fr}.hero .ring{grid-column:1/-1;justify-self:start;width:70px;height:70px;margin-bottom:12px}
  .hero .flag{font-size:42px}.hero .nm{font-size:21px}
  .status{flex-wrap:wrap}.status .r{margin-left:26px;text-align:left}
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .t.wt thead{display:none}
  .t.wt tr{display:grid;grid-template-columns:22px 1fr auto;gap:4px 8px;padding:10px 4px;border-bottom:1px solid var(--line)}
  .t.wt td{border:0;padding:0}
  .t.wt td.c-n{grid-row:span 3}.t.wt td.c-chk,.t.wt td.c-spd{grid-column:2/4}.t.wt td.c-sc{grid-row:1;grid-column:3}
  .t.wt td.c-act{grid-column:2/4}.t.wt tr.sec{display:block}
  .drawer{width:100vw;top:auto;height:92vh;border-left:0;border-top:1px solid var(--line2);border-radius:18px 18px 0 0;transform:translateY(105%)}
  .drawer.on{transform:none}
  .flow{height:460px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg2) 92%,transparent);border-top:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);text-decoration:none;padding:4px 0;position:relative}
  .tabbar a .ic{font-size:19px}
  .tabbar a.on{color:var(--acc)}
  .tabbar .badge{position:absolute;top:0;right:22%;font-size:10px;background:var(--bad);color:#fff;border-radius:99px;padding:0 5px}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:58;background:var(--card);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;padding:12px 12px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:.25s}
  .sheet.on{transform:none}
  .sheet a{display:flex;gap:12px;padding:13px 10px;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none;font-size:15px}
}
@media (min-width:901px){.sheet{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.devic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;margin-right:9px;vertical-align:middle;background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc);cursor:pointer}
.devmodal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px)}
.devcard{width:min(620px,100%);max-height:90vh;overflow:auto}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.kbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:transparent;color:inherit;font:12px/1.2 inherit;cursor:pointer;text-align:center}
.kbtn:hover{border-color:var(--acc)}.kbtn.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
</style>
</head>
<body>
<div id="bgfx"><i></i><i></i><i></i></div>
<div class="shell">
  <aside class="side">

<script>
"use strict";
const $=s=>document.querySelector(s);
const store={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isMobile=()=>matchMedia('(max-width:900px)').matches;
let S=null,W=null,MET=null,TRF=null,FLOW=null,EVS=null,DEVS=null;
let page='home';
// Окно один для всех баллов — то же, по которому решает сторож (scoreWindow = 6 ч).
// Статистика за 1 ч / 24 ч — только в подробностях сервера (кнопка «i»).
const win='w6';
const winSec=()=>21600, winTxt=()=>'6 ч';

// ---------- тема и эффекты ----------
function applyTheme(){
  document.body.classList.toggle('simple',store.get('uiMode','simple')!=='expert');
  let t=store.get('theme','xrock');if(t==='unifi'){t='xrock';store.set('theme',t)} document.documentElement.dataset.theme=t;
  const fxPref=store.get('fx','auto'); const full=fxPref==='full'||(fxPref==='auto'&&!isMobile()&&matchMedia('(pointer:fine)').matches);
  document.body.classList.toggle('fx',full);
  $('meta[name=theme-color]').content=t==='srm'?'#e9eef4':t==='unifi'?'#131417':'#07070d';
}
const fxOn=()=>document.body.classList.contains('fx');

// ---------- мелочи ----------
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2600)}
async function api(path,body,method){
  const r=await fetch(path,body!==undefined?{method:method||'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{cache:'no-store'});
  const ct=r.headers.get('content-type')||''; const j=ct.includes('json')?await r.json().catch(()=>({})):{error:await r.text()};
  if(r.status===401&&j.login){location.href='/login';throw new Error('нужен вход')}
  if(!r.ok) throw new Error(j.error||('HTTP '+r.status)); return j;
}
function splitFlag(tag){const c=[...(tag||'')];if(c.length>=2){const a=c[0].codePointAt(0),b=c[1].codePointAt(0);if(a>=0x1F1E6&&a<=0x1F1FF&&b>=0x1F1E6&&b<=0x1F1FF)return{flag:c[0]+c[1],cc:String.fromCharCode(a-0x1F1E6+65,b-0x1F1E6+65),name:c.slice(2).join('').trim()}}return{flag:'',cc:'',name:tag||''}}
function srvName(tag,withProto){const {flag,name}=splitFlag(tag);let n=name,p='';const m=name.match(/^(.*?)\s*\(([^)]*)\)\)?$/);if(m){n=m[1];p=m[2]}return `${flag?`<span class="fl">${flag}</span> `:''}${esc(n)}${withProto&&p?` <span class="n" style="font-weight:400">${esc(p)}</span>`:''}`}
function ago(t){if(!t)return'—';const s=Math.max(0,Math.round(Date.now()/1000-t));return s<60?s+' с назад':s<3600?Math.round(s/60)+' мин назад':s<86400?Math.round(s/3600)+' ч назад':Math.round(s/86400)+' дн назад'}
function dur(s){s=Math.max(0,Math.round(s));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?`${d} д ${h} ч`:h?`${h} ч ${m} мин`:`${m} мин`}
function tm(t,sec){return new Date(t*1000).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:sec?'2-digit':undefined})}
function gb(b){b=b||0;return b>=1073741824?(b/1073741824).toFixed(b>=10737418240?0:1)+' ГБ':b>=1048576?(b/1048576).toFixed(0)+' МБ':(b/1024).toFixed(0)+' КБ'}
function mbps(k){return (k/1000).toFixed(k<10000?1:0)}
const col=v=>v>=75?'var(--good)':v>=50?'var(--mid)':'var(--bad)';
const clsMs=d=>d<250?'g':d<600?'m':'b';

// ---------- графики (SVG) ----------
function area(data,color,h,opts={}){
  const W2=300,H=h||42; if(!data||data.length<2) return `<svg viewBox="0 0 ${W2} ${H}" preserveAspectRatio="none" style="height:${H}px"></svg>`;
  const vals=data.map(v=>v??0), mx=(opts.max??Math.max(...vals,1e-9))*1.12, mn=opts.min??0;
  const pts=vals.map((v,i)=>[(i/(vals.length-1)*W2).toFixed(1),(H-(v-mn)/(mx-mn||1)*H).toFixed(1)]);
  const d='M'+pts.map(p=>p.join(',')).join(' L'); const id='g'+Math.random().toString(36).slice(2);
  let extra=''; if(opts.data2){const v2=opts.data2;const p2=v2.map((v,i)=>[(i/(v2.length-1)*W2).toFixed(1),(H-((v??0)-mn)/(mx-mn||1)*H).toFixed(1)]);const d2='M'+p2.map(p=>p.join(',')).join(' L');
    extra=`<path d="${d2} L${W2},${H} L0,${H}Z" fill="${opts.color2}" opacity=".18"/><path d="${d2}" fill="none" stroke="${opts.color2}" stroke-width="1.4" vector-effect="non-scaling-stroke"/>`}
  return `<svg viewBox="0 0 ${W2} ${H}" preserveAspectRatio="none" style="height:${H}px"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".42"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${W2},${H} L0,${H}Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>${extra}</svg>`;
}
function ring(v,size,label){const r=36,c=2*Math.PI*r,pct=Math.max(0,Math.min(100,v||0));const id='rg'+Math.random().toString(36).slice(2);
  return `<div class="ring" style="width:${size||86}px;height:${size||86}px"><svg viewBox="0 0 84 84"><defs><linearGradient id="${id}"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${v>=50?`url(#${id})`:'var(--bad)'}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(c*pct/100).toFixed(1)} ${c.toFixed(1)}" style="transition:stroke-dasharray .8s"/></svg><b>${v==null?'—':v}</b>${label?`<small>${label}</small>`:''}</div>`}
function scoreHTML(s){if(!s||!s.n) return '<span class="n">—</span>';const v=s.score;return `<span class="sc" title="Сервисы ${Math.round(s.up*100)}% → ${s.pUp}/40\nОтклик ${s.ms||'—'} мс → ${s.pPing}/20\nСкорость ${s.ns?s.mbps.toFixed(1)+' Мбит/с':'—'} → ${s.pSpeed}/25\nБез заморозки ${s.ns?Math.round(s.dlOK*100)+'%':'—'} → ${s.pDL}/15${s.pJit?'\nРазброс отклика ±'+s.jitter+' мс → −'+s.pJit:''}${s.eligible?'':'\n(мало данных)'}"><s><u style="width:${v}%;background:${col(v)}"></u></s><span style="color:${col(v)}">${s.eligible?v:'…'+v}</span></span>`}
// плавная смена чисел
function countTo(el,to,fmt){const from=parseFloat(el.dataset.v||to);el.dataset.v=to;if(!fxOn()||from===to||isNaN(from)){el.innerHTML=fmt(to);return}const t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/600),e=1-Math.pow(1-k,3);el.innerHTML=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
// наклон карточек под мышкой (только полные эффекты)
document.addEventListener('mousemove',e=>{if(!fxOn())return;const c=e.target.closest('.tilt');document.querySelectorAll('.tilt').forEach(x=>{if(x!==c)x.style.transform=''});if(!c)return;const r=c.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(900px) rotateX(${(-y*4).toFixed(2)}deg) rotateY(${(x*5).toFixed(2)}deg)`});

// ---------- навигация (2.3: 8 разделов, внутри — вкладки) ----------
// Ключ вкладки: «страница» или «страница:фильтр». Страница — это <section id="p-…">.
const SECS=[['home','◉','Обзор'],['watch','🛡','Сторож'],['servers','☰','Серверы'],
  ['devices','📱','Устройства',[['devices','Список'],['map','Карта']]],
  ['sites','🌐','Правила'],['net','📶','Сеть'],
  ['logs','🗒','Журнал',[['events','События'],['logs:access','Xray'],['logs:keenetic','Роутер'],['logs:selector','Программа']]],
  ['settings','⚙','Настройки',[['settings:main','Основные'],['settings:tg','Telegram'],['tools:sub','Подписка'],['tools:reserve','Резерв'],['tools:maint','Обслуживание'],['settings:pw','Пароль']]]];
const PAGES=SECS; // совместимость со старым кодом
const TABS=['home','watch','servers','devices','more'];
let pageKey=store.get('pageKey','home'), pageFilter='';
page=pageKey.split(':')[0]; pageFilter=pageKey.split(':')[1]||'';
function secOfKey(k){for(const s of SECS){if(s[0]===k&&!s[3])return s;if(s[3]&&s[3].some(x=>x[0]===k))return s}return null}
function resolveKey(p){
  if(p&&p[0]==='=')return p.slice(1); // точный ключ вкладки (кнопки вкладок): «devices» — это и раздел, и вкладка «Список»
  const sec=SECS.find(s=>s[0]===p);
  if(sec&&sec[3]&&curSec()[0]===p)return sec[3][0][0]; // повторный клик по разделу — на первую вкладку
  if(sec){if(!sec[3])return p;const last=store.get('sub_'+p,'');return sec[3].some(x=>x[0]===last)?last:sec[3][0][0]}
  for(const s of SECS){if(!s[3])continue;const x=s[3].find(x=>x[0]===p)||s[3].find(x=>x[0].split(':')[0]===p);if(x)return x[0]}
  return 'home';
}
function curSec(){return secOfKey(pageKey)||SECS[0]}
function renderNav(){
  const unread=unreadCount(), cs=curSec()[0];
  const bd=id=>id==='logs'&&unread?`<span class="badge">${unread}</span>`:'';
  $('#nav').innerHTML=SECS.map(([id,ic,t])=>`<a data-go="${id}" class="${cs===id?'on':''}"><span class="ic">${ic}</span>${t}${bd(id)}</a>`).join('');

  if(t=T('[data-wadd1]')){const g=t.dataset.wg;wpost({group:g,servers:[...wg(g).servers,t.dataset.wadd1]});toast('Добавлен в сторож');closeOverlays();return}
  if(t=T('[data-wpick]')){openServerPicker(t.dataset.wpick);return}
  if(t=T('[data-wadd]')){const g=t.dataset.wadd,v=document.getElementById('wadd-'+g).value;if(!v){toast('Выберите сервер');return}wpost({group:g,servers:[...wg(g).servers,v]});return}
  if(t=T('[data-wlock]')){const g=t.dataset.wg,s=t.dataset.wlock,on=(wg(g).locked||[]).includes(s);wpost(on?{group:g,unlock:s}:{group:g,lock:s});return}
  if(t=T('[data-wpin]')){const g=t.dataset.wg,s=t.dataset.wpin,on=(wg(g).pinned||[]).includes(s);wpost(on?{group:g,unpin:s}:{group:g,pin:s});return}
  if(t=T('[data-wresetex]')){wpost({group:t.dataset.wresetex,resetExcluded:true});return}
  if(t=T('[data-wcheck]')){wpost({group:t.dataset.wcheck,checkNow:true});toast('Проверяю…');return}
  if(t=T('[data-bsync]')){if(await wpost({group:t.dataset.bsync,syncNow:true}))toast('Группа в конфиге обновлена');return}
  if(t=T('[data-xrestart]')){restartXray();return}
  if(t=T('#testShown')){testTags(shownTags());return}
  if(t=T('#sSave')||T('#sSave2')){saveSettings();return}
  if(t=T('[data-tg]')){const a=t.dataset.tg;if(a==='clear'&&!confirm('Отключить бота?'))return;t.disabled=true;try{const r=await api('/api/telegram',{token:($('#tgTok')||{}).value||'',action:a});if(a==='sample'){toast('Пример придёт примерно через минуту');t.disabled=false;return}
    if(a==='sendtest'){toast(r.ok?'Тест отправлен — проверьте Telegram':'Не всё доставлено');tgStatus(r);t.disabled=false;return}
    toast(a==='test'?'Подключено'+(r.chat?': '+r.chat:''):a==='admin'?'Личка подключена: '+(r.name||''):a==='pin'?'Статус закреплён':'Отключено');loadState()}catch(err){alert(err.message)}t.disabled=false;return}
  if(t=T('#enTgRoute')){if(!confirm('Добавить в правила XKeen адреса Telegram (через VPN)? Будет резервная копия, правило проверится самим Xray, затем Xray перезапустится — связь пропадёт на 5–10 секунд.'))return;try{await api('/api/tg-route',{});alert('Готово, Xray перезапускается');loadTraffic()}catch(err){alert(err.message)}return}
  if(t=T('#enStats')){if(!confirm('Добавить статистику трафика в конфиг Xray? Будет сделана резервная копия. После этого нужен перезапуск Xray.'))return;try{await api('/api/xray-stats',{});if(confirm('Готово. Перезапустить Xray сейчас?'))restartXray();loadTraffic()}catch(err){alert(err.message)}return}
  if(t=T('[data-dsort]')){const k=t.dataset.dsort;devSort=devSort.k===k?{k,d:-devSort.d}:{k,d:(k==='name'||k==='ip')?1:-1};store.set('devSort',JSON.stringify(devSort));renderDevices();return}
  if(t=T('[data-dopen]')){const id=t.dataset.dopen;devOpen.has(id)?devOpen.delete(id):devOpen.add(id);renderDevices();return}
  if(t=T('[data-tunall]')){const all=(TUN&&TUN.tunnels||[]).map(r=>r.iface.name);if(!all.length)return;if(!confirm('Взять все подключения Keenetic ('+all.length+') в резерв и сразу проверить? Xray перезапустится (5–10 с).'))return;t.disabled=true;t.textContent='применяю…';try{await api('/api/reserve',{ifaces:all,auto:true});await api('/api/tunnels',{});toast('Готово, идёт проверка');setTimeout(loadTunnels,15000)}catch(err){toast('Ошибка: '+err.message)}t.disabled=false;t.textContent='⇩ Взять все в резерв';return}
  if(t=T('[data-tuncheck]')){t.disabled=true;t.textContent='проверяю…';await api('/api/tunnels',{});setTimeout(loadTunnels,15000);return}
  if(t=T('[data-drule]')){const d=DEVS.find(x=>x.id===t.dataset.drule);if(d)openDevRules(d);return}
  if(t=T('[data-dname]')){const d=DEVS.find(x=>x.id===t.dataset.dname);if(d)openDevEditor(d);return}
  if(t=T('[data-dmerge]')){const others=DEVS.filter(x=>x.id!==t.dataset.dmerge&&x.name&&!x.mergeInto);if(!others.length){toast('Сначала дайте имена другим устройствам');return}
    const n=prompt('С каким устройством склеить? Напишите его имя:\n'+others.map(x=>'• '+x.name).join('\n'));const tgt=others.find(x=>x.name.toLowerCase()===String(n||'').trim().toLowerCase());if(n!==null&&!tgt){toast('Не нашёл такое имя');return}if(tgt){await api('/api/devices',{id:t.dataset.dmerge,mergeInto:tgt.id});toast('Склеено с '+tgt.name);loadDevices()}return}
  if(t=T('[data-ddel]')){if(confirm('Убрать устройство из списка? Если оно снова появится в сети — вернётся как новое.')){await api('/api/devices',{id:t.dataset.ddel,delete:true});loadDevices()}return}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.matches('[data-wtoggle]'))wpost({group:t.dataset.wtoggle,enabled:t.checked});
  if(t.matches('[data-wauto]')){wpost({group:t.dataset.wauto,auto:t.checked});if(t.checked)toast('Автокандидаты включены: текущие серверы стали стабильными')}
  if(t.id==='srvSort'){srvSort=t.value;store.set('sort2',srvSort);renderTilesOnly()}
  if(t.id==='restoreFile'&&t.files[0]){t.files[0].text().then(async x=>{try{const j=JSON.parse(x);const n=Object.keys(j.xrayConfigs||{}).length;const withCfg=n&&confirm('В копии есть конфиги Xray ('+n+' файлов). Восстановить и их? Xray перезапустится, с проверкой и откатом.\n\nОтмена — восстановить только настройки панели.');
  const r=await api('/api/backup',{state:j.state,devices:j.devices,rules:j.rules,xrayConfigs:withCfg?j.xrayConfigs:undefined});toast(r.cfgError?'Настройки восстановлены, конфиги — нет: '+r.cfgError:'Восстановлено');loadState()}catch(err){alert('Не удалось: '+err.message)}})}
});
document.addEventListener('input',e=>{if(e.target.id==='srvQ'){srvQ=e.target.value;renderTilesOnly()}});
async function testTags(tags){if(!tags.length)return;try{await api('/api/test',{tags});S.testing=[...new Set([...S.testing,...tags])];renderPage();setTimeout(loadState,800)}catch(e){toast('Ошибка: '+e.message)}}
async function pick(group,target){if(!group){toast('Нет группы');return}try{await api('/api/select',{group,target});toast(target?'Основной: '+splitFlag(target).name:'Режим «Авто»');closeOverlays();loadState()}catch(e){toast('Не удалось: '+e.message)}}
async function setDead(tags,dead){try{const r=await api('/api/dead',{tags,dead});toast(dead?`В мёртвых: +${r.changed}`+(r.skipped&&r.skipped.length?` (${r.skipped.length} в стороже — пропущены)`:''):`Возвращено: ${r.changed}`);closeOverlays();loadState()}catch(e){toast('Ошибка: '+e.message)}}

const TZS=[[120,'Калининград (UTC+2)'],[180,'Москва (UTC+3)'],[240,'Самара (UTC+4)'],[300,'Екатеринбург (UTC+5)'],[360,'Омск (UTC+6)'],[420,'Новосибирск, Красноярск (UTC+7)'],[480,'Иркутск (UTC+8)'],[540,'Якутск (UTC+9)'],[600,'Владивосток (UTC+10)'],[660,'Магадан, Сахалин (UTC+11)'],[720,'Камчатка (UTC+12)'],[0,'UTC']];
function tzName(m){const x=TZS.find(t=>t[0]===(m??180));return x?x[1]:'UTC'+(m>=0?'+':'')+(m/60)}
</script>
<script>
"use strict";
// ================= САЙТЫ =================
let SITES=null, siteQ='', siteOpen=new Set();
async function loadSites(){try{SITES=await api('/api/sites');}catch(e){SITES={error:e.message}}if(page==='sites')renderPage()}
const KIND={vpn:['a','через VPN'],direct:['g','напрямую'],block:['b','блокировать'],other:['','особое']};
// regexp:… с \xHH — показать коротко и читаемо
function rxDecode(x){return x.replace(/\\x([0-9a-fA-F]{2})/g,(_,h)=>String.fromCharCode(parseInt(h,16)))}
function entryLabel(x){if(!x.startsWith('regexp:'))return esc(x.replace(/^domain:/,''));const d=rxDecode(x.slice(7));
  const words=(d.match(/[a-z0-9-]{3,}/gi)||[]).slice(0,4).join(', ');return `<span class="rx" title="${esc(d)}">шаблон${words?': '+esc(words)+(d.length>60?'…':''):''}</span>`}
function entryHTML(r,x,off){return `<span class="chip" style="${off?'opacity:.5;text-decoration:line-through':''}" title="${esc(x.startsWith('regexp:')?rxDecode(x):x)}">${entryLabel(x)}
  <b data-sop="${off?'enable':'disable'}" data-rule="${r.index}" data-val="${esc(x)}" title="${off?'Включить снова':'Временно отключить'}" style="cursor:pointer;margin-left:6px">${off?'↺':'⊘'}</b>
  <b data-sop="remove" data-rule="${r.index}" data-val="${esc(x)}" title="Удалить" style="cursor:pointer;margin-left:4px">✕</b></span>`}
function renderSites(){
  const el=$('#sitesOld')||$('#p-sites'); if(el.contains(document.activeElement)&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;
  if(!SITES){el.innerHTML='<div class="card empty"><span class="spin"></span></div>';return}
  if(SITES.error){el.innerHTML=`<div class="card"><div class="banner">${esc(SITES.error)}</div></div>`;return}
  const q=siteQ.toLowerCase();
  const countries=(SITES.countries||[]).map(c=>`<option value="${esc(c.flag)}">${esc(c.flag)} (${c.n} серв.)</option>`).join('');
  const rulesAll=(SITES.rules||[]).filter(r=>!r.managed);
  const mkRule=r=>{
    const all=[...(r.domain||[]),...(r.ip||[])], off=[...(r.offDomain||[]),...(r.offIP||[])];
    const match=x=>!q||x.toLowerCase().includes(q);
    const shown=all.filter(match), shownOff=off.filter(match);
    if(q&&!shown.length&&!shownOff.length)return '';
    const [cls,kn]=KIND[r.kind]||KIND.other;
    const bind=(r.balancer||'').startsWith('xsel-');
    const target=r.balancer?(bind?'страна '+esc(r.balancer.slice(5).toUpperCase()):'группа '+esc(r.balancer)):esc(r.outbound||'');
    const open=siteOpen.has(r.index)||!!q, many=shown.length+shownOff.length>40&&!open;
    // 0.9: записи — группами по сервисам каталога, нераспознанное — «Свои сайты»
    const sv=r.svc||{},grp={};(many?shown.slice(0,40):shown).forEach(x=>{(grp[sv[x]||'']=grp[sv[x]||'']||[]).push([x,false])});if(!many)shownOff.forEach(x=>{(grp[sv[x]||'']=grp[sv[x]||'']||[]).push([x,true])});
    const names=Object.keys(grp).filter(k=>k).sort();const multi=names.length>0;
    const chips=[...names,''].filter(k=>grp[k]).map(k=>`${multi?`<span class="svcl">${k?esc(k):'Свои сайты'}</span>`:''}${grp[k].map(([x,o])=>entryHTML(r,x,o)).join('')}`).join(multi?'<span class="svcbr"></span>':'');
    return `<div class="card" style="padding:14px 16px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:${all.length+off.length?8:0}px">
      <span class="tag ${cls}">${bind?'🌍 '+kn+' · привязка':kn}</span><span class="note">${esc(r.description)} → ${target}</span>
      ${bind?`<button class="btn sm" data-unbind="${esc(r.balancer)}" style="margin-left:auto">Снять привязку</button>`:''}</div>
      ${all.length+off.length?`<div class="chips" style="flex-wrap:wrap">${chips}${many?`<button class="btn sm" data-sopen="${r.index}">показать все ${shown.length+shownOff.length}</button>`:''}</div>`:''}</div>`};
  const sysR=rulesAll.filter(r=>r.system).map(mkRule).filter(Boolean);
  const rules=rulesAll.filter(r=>!r.system).map(mkRule).join('')+(sysR.length?`<details class="card x-exp" style="padding:12px 16px" ${q?'open':''}><summary><b>Служебные правила (${sysR.length})</b> <span class="note">— локальные адреса, QUIC, вход XKeen, «всё остальное». Обычно трогать не нужно.</span></summary><div style="margin-top:10px">${sysR.join('')}</div></details>`:'');
  el.innerHTML=`<div class="grid g2">
   <div class="card"><h3>Проверить сайт</h3><div class="tools"><input class="in" id="stHost" placeholder="instagram.com или ссылка" style="flex:1;min-width:180px">
     <button class="btn" id="stRoute">Куда пойдёт</button><button class="btn pri" id="stDiag">Почему не открывается</button></div><div id="stOut" style="margin-top:10px"></div></div>
   <div class="card"><h3>Добавить сайты</h3><textarea class="in" id="stAdd" placeholder="Сайты, ссылки или IP — через пробел, запятую или с новой строки" style="min-height:70px"></textarea>
     <div class="tools" style="margin-top:8px"><select class="in" id="stTarget"><option value="vpn">через VPN</option><option value="direct">всегда напрямую</option><option value="block">блокировать</option><option value="bind">через страну…</option></select>
     <select class="in" id="stCountry" style="display:none">${countries}</select><button class="btn pri" id="stApply">Проверить и применить</button></div><div id="stAddOut" class="note" style="margin-top:8px"></div></div></div>
  <div class="card" style="padding:12px 16px"><div class="tools"><input class="in" id="stQ" placeholder="Поиск по всем правилам" value="${esc(siteQ)}" style="flex:1">
   <span class="note">${esc(SITES.file||'')} · правила проверяются сверху вниз — срабатывает первое подходящее; сервисы из «Правил» выше идут раньше этих · ⊘ — временно отключить, ✕ — удалить</span></div></div>
  ${rules||'<div class="card empty">Ничего не найдено</div>'}
  <div class="card"><h3>Резервные копии конфигов<span class="r">делаются перед каждым изменением, хранятся последние 20</span></h3>
   ${(SITES.backups||[]).slice(0,8).map(b=>`<div style="display:flex;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line)"><span class="mono n" style="white-space:nowrap">${esc(b.id.replace(/^(\d{4})(\d\d)(\d\d)-(\d\d)(\d\d)(\d\d).*/,'$3.$2 $4:$5'))}</span><span style="flex:1;min-width:0">${esc(b.what||'')}</span><button class="btn sm" data-restore="${esc(b.id)}">Вернуть</button></div>`).join('')||'<div class="note">Пока нет</div>'}</div>`;
  $('#stTarget').onchange=()=>{$('#stCountry').style.display=$('#stTarget').value==='bind'?'':'none'};
  let qt;$('#stQ').oninput=()=>{clearTimeout(qt);qt=setTimeout(()=>{siteQ=$('#stQ').value;const p=$('#stQ').selectionStart;renderSitesForce();const i=$('#stQ');i.focus();i.setSelectionRange(p,p)},250)};
}
function renderSitesForce(){const a=document.activeElement;a&&a.blur&&a.blur();renderSites()}

function stepsHTML(d){return `<table class="t">${(d.steps||[]).map(s=>`<tr><td>${s.ok?'<span class="g">✓</span>':'<span class="b">✕</span>'}</td><td><b>${esc(s.name)}</b><div class="note">${esc(s.info||'')}</div></td><td class="mono n">${s.ms?s.ms+' мс':''}</td></tr>`).join('')}</table>
  ${d.verdict?`<div class="banner" style="margin-top:10px">${esc(d.verdict)}</div>`:''}`}

// 0.9: правки сайтов копятся и применяются пачкой — один перезапуск Xray вместо десяти
let SITE_Q=[];
function siteOpText(b){const v=(b.values||[]).join(', ');const tg={vpn:'через VPN',direct:'напрямую',block:'блокировать'}[b.target]||b.target||'';
  return {addTo:`добавить в «${tg}»: ${v}`,add:`добавить в правило: ${v}`,remove:`удалить: ${v}`,disable:`временно отключить: ${v}`,enable:`включить: ${v}`,bind:`привязать к стране ${b.target}: ${v}`,unbind:`снять привязку к стране: ${v}`,ruleOff:'отключить правило',ruleOn:'включить правило'}[b.op]||b.op}
async function siteChange(body,confirmText){
  if(body.op==='restore'){try{await api('/api/sites',body);await loadSites();return true}catch(e){alert(e.message);return false}}
  SITE_Q.push({...body});toast('Добавлено в список изменений — нажмите «Проверить и применить» внизу');renderSiteBar();return true}
function renderSiteBar(){let b=$('#siteBar');if(!SITE_Q.length){if(b)b.remove();return}
  if(!b){b=document.createElement('div');b.id='siteBar';b.className='savebar';document.body.appendChild(b)}
  b.innerHTML=`<span>⚠️ <b>Изменения сайтов ещё не применены (${SITE_Q.length})</b><span class="note" style="display:block;max-height:4.5em;overflow:auto">${SITE_Q.map(x=>esc(siteOpText(x))).join('<br>')}</span></span><span class="sp"></span><button class="btn" id="siteQReset">Отменить</button><button class="btn pri" id="siteQApply">Проверить и применить</button>`;
  b.style.display=page==='sites'?'':'none'}
async function siteQApply(){const ops=SITE_Q.map(x=>({op:x.op,rule:x.rule,values:x.values,target:x.target}));
  try{const dry=await api('/api/sites',{ops,dry:true});
    if(dry.nochange){alert('Ничего не изменится');SITE_Q=[];renderSiteBar();return}
    if(!dry.ok){alert('Xray не примет эти изменения:\n'+(dry.testError||''));return}
    const diff=[...(dry.removed||[]).slice(0,6).map(x=>'− '+x.slice(0,140)),...(dry.added||[]).slice(0,6).map(x=>'+ '+x.slice(0,140))].join('\n');
    if(!confirm(SITE_Q.length+' изменений:\n'+SITE_Q.map(siteOpText).join('\n')+'\n\n'+diff+'\n\nПроверено Xray. Применить? Xray перезапустится один раз, связь пропадёт на 5–10 с.'))return;
    toast('Применяю…');await api('/api/sites',{ops});SITE_Q=[];renderSiteBar();toast('Готово');await loadSites();if(typeof loadRules==='function')loadRules()}
  catch(e){alert(e.message);await loadSites()}}
document.addEventListener('click',e=>{if(e.target.closest('#siteQApply')){siteQApply();return}if(e.target.closest('#siteQReset')){SITE_Q=[];renderSiteBar();toast('Изменения отменены')}});
window.addEventListener('beforeunload',e=>{if(SITE_Q.length){e.preventDefault();e.returnValue=''}});

document.addEventListener('click',async e=>{
  const T=s=>e.target.closest(s);let t;
  if(page!=='sites'&&page!=='tools'&&page!=='settings')return;
  if(t=T('[data-sopen]')){siteOpen.add(+t.dataset.sopen);renderSites();return}
  if(t=T('[data-sop]')){await siteChange({op:t.dataset.sop,rule:+t.dataset.rule,values:[t.dataset.val]});return}
  if(t=T('[data-unbind]')){await siteChange({op:'unbind',target:SITES.countries.find(c=>('xsel-'+[...c.flag].map(ch=>String.fromCharCode(ch.codePointAt(0)-0x1F1E6+97)).join(''))===t.dataset.unbind)?.flag||t.dataset.unbind.slice(5)});return}
  if(t=T('[data-restore]')){if(!confirm('Вернуть конфиги из этой копии? Xray перезапустится.'))return;try{await api('/api/sites',{op:'restore',target:t.dataset.restore});alert('Готово');loadSites()}catch(err){alert(err.message)}return}
  if(t=T('#stRoute')||T('#stDiag')){const h=$('#stHost').value.trim();if(!h)return;const out=$('#stOut');out.innerHTML='<span class="spin"></span> проверяю…';
    try{if(t.id==='stRoute'){const r=await api('/api/diag?route=1&host='+encodeURIComponent(h));const [cls,kn]=KIND[r.kind]||KIND.other;
      out.innerHTML=`<div><span class="tag ${cls}">${kn}</span> ${r.rule>=0?`правило №${r.rule+1}`:''} · <span class="note">${esc(r.why||'')}</span>${r.active?`<div class="note">сейчас через ${srvName(r.active,true)}</div>`:''}${r.disabled?`<div class="note">совпало бы с отключённой записью ${esc(r.disabled)}</div>`:''}<div class="note mono">${esc((r.ips||[]).slice(0,4).join(', '))}</div></div>`}
    else{const dg=await api('/api/diag?host='+encodeURIComponent(h));out.innerHTML=stepsHTML(dg)+`<div class="tools" style="margin-top:10px"><button class="btn pri" data-addvpn="${esc(h)}">Добавить в VPN</button><span class="note">сайт пойдёт через VPN-серверы</span></div>`}}catch(err){out.textContent=err.message}return}
  if(t=T('[data-addvpn]')){await siteChange({op:'addTo',target:'vpn',values:[t.dataset.addvpn]});return}
  if(t=T('#stApply')){const v=$('#stAdd').value.trim();if(!v)return;const tg=$('#stTarget').value;
    const ok=tg==='bind'?await siteChange({op:'bind',target:$('#stCountry').value,values:[v]}):await siteChange({op:'addTo',target:tg,values:[v]});
    if(ok){$('#stAdd').value='';$('#stAddOut').textContent='Готово'}return}
  // ---- обслуживание ----

function planHTML(p){if(!p)return'';const l=(a,n)=>a&&a.length?`<div class="note">${n} (${a.length}): ${a.slice(0,12).map(x=>esc(x)).join(', ')}${a.length>12?'…':''}</div>`:'';
  return `<div><b>${esc(p.file)}</b> · скачано ${esc(p.via||'')} · без изменений: ${p.same||0}</div>${l(p.added,'Новые')}${l(p.removed,'Убраны')}${l(p.changed,'Изменились')}${l(p.skipped,'Пропущены')}`}

let TOOLS=null;

async function loadTools(){try{const [m,s,r]=await Promise.all([api('/api/maint'),api('/api/sub'),api('/api/reserve')]);TOOLS={m,s,r}}catch(e){TOOLS={error:e.message}}if(page==='tools')renderTools()}

   ${s.support||s.webPage?`<div class="tools" style="margin-bottom:10px">${s.support?`<a class="btn sm" target="_blank" rel="noopener" href="${esc(s.support)}">💬 Написать в поддержку</a>`:''}${s.webPage?`<a class="btn sm" target="_blank" rel="noopener" href="${esc(s.webPage)}">Личный кабинет ↗</a>`:''}</div>`:''}

async function openServerPicker(gtag){
  const w=wg(gtag),dead=new Set(S.dead||[]),inList=new Set(w.servers||[]);
  let sc24={};try{const st=await api('/api/state?win=86400');sc24=st.scores||{}}catch(e){}
  const tried=w.tried||{},now=Date.now()/1000;
  const rows=S.servers.filter(s=>!inList.has(s.tag)&&!dead.has(s.tag)).map(s=>{const st=S.stats&&S.stats[s.tag],w24=st&&st.w&&st.w.w24;
    const up=w24&&w24.n?Math.round((w24.n-w24.fail)*100/w24.n):null,ping=w24&&w24.avg||(S.results[s.tag]&&S.results[s.tag].delay)||0;
    return {tag:s.tag,net:s.network||'',sc:sc24[s.tag],up,ping,rej:tried[s.tag]&&now-tried[s.tag]<86400}});
  let sortBy='score',q='',sel=new Set();
  const box=document.createElement('div');box.className='devmodal';

function dnsRow(r,main){const st=r.ok?'<span class="g">✓ отвечает</span>':r.block?'<span class="b">✕ блокирует провайдер</span> <span class="note">(через VPN отвечает)</span>':'<span class="b">✕ '+esc(r.err||'не отвечает')+'</span>';

  const st9=S9&&S9.n24?`<div class="note" style="margin-top:3px">доступность ${pct(S9.up24)} % за сутки${S9.days>1?' · '+pct(S9.up7)+' % за '+S9.days+' дн':''}${S9.eps?` · ${S9.eps} сбо${S9.eps===1?'й':S9.eps<5?'я':'ев'} за сутки${S9.longMin?', самый долгий '+S9.longMin+' мин':''}`:' · без сбоев'}${S9.med?` · обычно ${S9.med} мс${S9.p90>S9.med*1.5?' (бывает до '+S9.p90+')':''}`:''}${S9.cache?' (ответ из памяти роутера)':''}${S9.block7?` · провайдер блокировал ${S9.block7} раз`:''}${S9.down7?` · сервер не отвечал ${S9.down7} раз`:''}${(S9.badHrs||[]).length?' · чаще сбоит в '+S9.badHrs.map(h=>h+' ч').join(', '):''}</div>`:'';

     <div class="note" style="margin-bottom:8px">Эти сайты всегда открываются через ваш обычный интернет, как будто VPN нет. Так банки и Госуслуги не блокируют вход «из-за границы», а игровые серверы дают меньший пинг.${D.mode===3?' <b>Сейчас выбрано «Абсолютно всё» — этот список не действует.</b>':''}</div>

  <div class="note" style="margin:-4px 4px 12px">Каталог: ${esc(R.catalog&&R.catalog.src||'встроенный')}${R.catalog&&R.catalog.updated?' · обновлён '+ago(R.catalog.updated):''}${R.catalog&&R.catalog.err?' · <span class="b">'+esc(R.catalog.err)+'</span>':''} · группа серверов: ${esc(R.balancer||'—')}</div>`;
}
async function rulesApply(body,what){
  try{const dry=await api('/api/rules',{...body,dry:true});
    if(dry.nochange){toast('Ничего не изменится');return false}
    if(!dry.ok){alert('Xray не примет это изменение:\n'+(dry.testError||''));return false}
    const diff=[...(dry.removed||[]).slice(0,5).map(x=>'− '+x.slice(0,140)),...(dry.added||[]).slice(0,5).map(x=>'+ '+x.slice(0,140))].join('\n');
    if(!confirm((what||'Применить правила?')+'\n\n'+diff+'\n\nПроверено Xray. Применить? Xray перезапустится, связь пропадёт на 5–10 с.'))return false;
    toast('Применяю…');await api('/api/rules',body);toast('Готово');return true}
  catch(e){alert(e.message);return false}}

document.addEventListener('change',e=>{if(page!=='sites'||!RD)return;
  if(e.target.closest('#catVPN')){if(catalogClick(e,RD.vpn,()=>{RD.vpn.forEach(id=>RD.novpn.delete(id));RD.dirty=true;renderPage()}))return}
  if(e.target.closest('#catNO')){if(catalogClick(e,RD.novpn,()=>{RD.novpn.forEach(id=>RD.vpn.delete(id));RD.dirty=true;renderPage()}))return}
  if(e.target.name==='rmode'){RD.mode=+e.target.value;RD.dirty=true;renderPage();return}
  if(e.target.id==='rQuic'){RD.quicOff=e.target.checked;RD.dirty=true;renderPage();return}
  if(e.target.id==='rAds'){RD.ads=e.target.checked;RD.dirty=true;renderPage();return}
});
document.addEventListener('click',async e=>{if(page!=='sites')return;const T=s=>e.target.closest(s);let t;
  if(t=T('#rulReset2')){e.preventDefault();RD=draftFrom(RUL.state);renderPage();return}
  if(t=T('#rulSave2')){e.preventDefault();t=null;document.getElementById('rulSave').click();return}
  if(t=T('#rulReset')){RD=draftFrom(RUL.state);renderPage();return}
  if(t=T('#rulSave')){const ok=await rulesApply({action:'save',mode:RD.mode,vpn:[...RD.vpn],novpn:[...RD.novpn],quicOff:RD.quicOff,ads:RD.ads},`«${MODES[RD.mode-1][1]}»: через VPN — ${RD.vpn.size} сервисов, без VPN — ${RD.novpn.size}.`);
    if(ok){RD.dirty=false;await loadRules();loadSites()}return}
  if(t=T('#rulAbsorb')){const ok=await rulesApply({action:'absorb'},'Записи из ваших правил, которые относятся к сервисам каталога, будут убраны из ваших правил и включены как сервисы.');if(ok){RD=null;await loadRules();loadSites()}return}
  if(t=T('[data-rignore]')){try{await api('/api/rules',{action:'ignore',host:t.dataset.rignore});loadRules()}catch(err){toast(err.message)}return}
});
</script>
<script>
"use strict";
// ================= РЕЖИМ УСТРОЙСТВА (п. 17, 23, 24, 25) =================
const DMODES=[['','Как у всей сети'],['1','Только выбранное через VPN'],['2','Всё через VPN, кроме российского'],['3','Абсолютно всё через VPN'],['novpn','Без VPN совсем']];
function devModeTag(ip){const dv=RUL&&RUL.state&&RUL.state.devices&&RUL.state.devices[ip];if(!dv)return '';const now=Date.now()/1000;let h='';
  if(dv.temp&&dv.until>now)h+=` <span class="tag a" title="временно, до ${tm(dv.until)}">⏱ ${esc((DMODES.find(m=>m[0]===dv.temp)||[])[1]||dv.temp)}</span>`;
  else if(dv.mode)h+=` <span class="tag">${esc((DMODES.find(m=>m[0]===dv.mode)||[])[1]||dv.mode)}</span>`;
  if((dv.kidsBlock||[]).length||dv.adult)h+=' <span class="tag m" title="детские ограничения">👶</span>';return h}
function untilEveningMin(){const d=new Date();const e=new Date();e.setHours(23,0,0,0);if(e<=d)e.setDate(e.getDate()+1);return Math.round((e-d)/60000)}
async function openDevRules(d){if(!RUL||RUL.error)await loadRules();if(!RUL||RUL.error){toast('Не удалось загрузить правила');return}

  const kids=new Set(cur.kidsBlock||[]);const pinned=RUL.pinned&&RUL.pinned[d.ip];const now=Date.now()/1000;
  const kidSvcs=(RUL.services||[]).filter(s=>s.group!=='novpn');
  const box=document.createElement('div');box.className='devmodal';
  const draw=()=>{box.innerHTML=`<div class="card devcard" style="width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto">
   <h3>${esc(d.name||d.kname||'Устройство')}<span class="r note mono">${esc(d.ip)}</span></h3>
   ${pinned?'<div class="note g" style="margin-bottom:8px">✓ IP закреплён в Keenetic</div>':`<div class="banner" style="margin-bottom:10px">${RUL.pinnedErr?'Не удалось проверить, закреплён ли IP.':'IP этого устройства не закреплён — после перезагрузки он может смениться, и правила перестанут к нему относиться.'} Закрепите в Keenetic: «Список устройств» → устройство → «Постоянный IP-адрес». <a class="lnk" target="_blank" rel="noopener" href="${routerURL()}">Keenetic ↗</a></div>`}
   <div class="fg"><label>Режим интернета${qh('Свой режим для этого устройства. «Без VPN» — устройство всегда ходит через обычный интернет.')}<select class="in" id="drMode">${DMODES.map(([k,t])=>`<option value="${k}" ${cur.mode===k?'selected':''}>${t}${k===''?' (сейчас «'+MODES[(RUL.state.mode||1)-1][1]+'»)':''}</option>`).join('')}</select></label>
   <label>Реклама${qh('Блокировать рекламу только на этом устройстве (или, наоборот, не блокировать).')}<select class="in" id="drAds"><option value="" ${cur.ads==null?'selected':''}>как у всей сети</option><option value="1" ${cur.ads===true?'selected':''}>блокировать</option><option value="0" ${cur.ads===false?'selected':''}>не блокировать</option></select></label></div>
   <div style="margin:14px 0 6px"><b>Временно</b> ${cur.temp&&cur.until>now?`<span class="tag a">сейчас: ${esc((DMODES.find(m=>m[0]===cur.temp)||[])[1])} до ${tm(cur.until)}</span>`:''}</div>
   <div class="tools"><button class="btn" data-dt="3" data-min="60">На 1 час — всё через VPN</button><button class="btn" data-dt="3" data-min="${untilEveningMin()}">До вечера (23:00) — всё через VPN</button><button class="btn" data-dt="novpn" data-min="60">На 1 час — без VPN</button>${cur.temp?'<button class="btn" data-dt="" data-min="0">Снять</button>':''}</div>
   <div class="note" style="margin-top:4px">По окончании режим вернётся сам.</div>
   <details style="margin-top:14px" ${kids.size||cur.adult?'open':''}><summary><b>Детское устройство</b></summary>
    <label class="sw" style="display:flex;margin:10px 0"><input type="checkbox" id="drAdult" ${cur.adult?'checked':''}><span class="k"></span>Блокировать сайты для взрослых</label>
    <div class="tools"><span class="note">Блокировать отмеченные сервисы с</span><input class="in" type="number" id="drFrom" min="0" max="23" value="${cur.kidsFrom??22}" style="width:70px"><span class="note">до</span><input class="in" type="number" id="drTo" min="0" max="23" value="${cur.kidsTo??7}" style="width:70px"><span class="note">часов</span></div>
    <div id="drKids" style="margin-top:6px">${catalogHTML(kidSvcs,['popular','social','media','games','ai','work','other'],kids)}</div></details>
   <div class="tools" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-x="cancel">Закрыть</button><button class="btn pri" data-x="save">Проверить и применить</button></div></div>`;fixIndeterminate(box)};
  draw();document.body.appendChild(box);
  const read=()=>({mode:box.querySelector('#drMode').value,name:d.name||d.kname||'',ads:box.querySelector('#drAds').value===''?null:box.querySelector('#drAds').value==='1',
    adult:box.querySelector('#drAdult').checked,kidsBlock:[...kids],kidsFrom:+box.querySelector('#drFrom').value,kidsTo:+box.querySelector('#drTo').value});
  box.addEventListener('change',e=>{if(e.target.closest('#drKids')){const keep=read();catalogClick(e,kids,()=>{});Object.assign(cur,keep,{kidsBlock:[...kids]});draw()}});
  box.addEventListener('click',async e=>{const x=e.target.closest('[data-x]'),t=e.target.closest('[data-dt]');
    if(e.target===box||(x&&x.dataset.x==='cancel')){box.remove();return}

    if(x&&x.dataset.x==='save'){const ok=await rulesApply({action:'device',ip:d.ip,dev:read()},'Режим устройства '+(d.name||d.ip)+'.');if(ok){box.remove();await loadRules();renderPage()}}});
}

<script>

  tun:null,tunSel:new Set(),tunRes:{},tgTok:'',tgLevel:'important',tgMsg:'',log:[],applying:false,finished:false}}

  try{WZ.info=await api('/api/wizard')}catch(e){WZ.info={}}

  if(RUL&&RUL.state){(RUL.state.vpn||[]).forEach(id=>WZ.vpn.add(id));(RUL.state.novpn||[]).forEach(id=>WZ.novpn.add(id))}
  wzGo(0)}
function wzClose(){const b=$('#wizard');if(b)b.remove();clearTimeout(WZ&&WZ._t);WZ=null;renderPage()}
async function wzGo(i){WZ.step=i;clearTimeout(WZ._t);wzDraw();
  if(i===0&&!WZ.checks){try{WZ.checks=(await api('/api/wizard?checks=1')).checks}catch(e){WZ.checks=[{name:'Панель',ok:false,info:e.message}]}wzDraw()}
  if(i===5&&!WZ.tun){try{const r=await api('/api/reserve');WZ.tun=r.ifaces||[];(r.configured||[]).forEach(c=>WZ.tunSel.add(c.iface))}catch(e){WZ.tun=[]}wzDraw();
    for(const t of WZ.tun){if(!WZ||WZ.step!==5)break;WZ.tunRes[t.name]='…';wzDraw();try{const r=await api('/api/reserve',{check:t.name});WZ.tunRes[t.name]=r.ok?'ok':(r.why||'не открывает сервисы')}catch(e){WZ.tunRes[t.name]=e.message}if(WZ&&WZ.step===5)wzDraw()}}
}
function wzPoll(){clearTimeout(WZ._t);WZ._t=setTimeout(async()=>{if(!WZ)return;try{const j=await api('/api/wizard?job=1');if(WZ.step===2)WZ.job=j;if(WZ.step===4)WZ.pick=j;wzDraw();if(j&&j.running)wzPoll()}catch(e){}},1200)}
const SVCS=['YT','WA','TG','IG','GPT','Claude'];
function wzTable(j){if(!j)return '';const rows=(j.rows||[]).slice().sort((a,b)=>(b.okn-a.okn)||((a.alive?a.ms:9e9)-(b.alive?b.ms:9e9)));

function wzWorking(j){return j?(j.rows||[]).filter(r=>r.alive&&r.okn>0).length:0}
function wzDraw(){const box=$('#wizard');if(!box||!WZ)return;const i=WZ.step,inf=WZ.info||{};let body='',next=true,nextTxt='Дальше';

    ${c.some(x=>!x.ok)?'<div class="banner" style="margin-top:10px">Не всё в порядке, но мастер можно пройти дальше. То, что отмечено ✕, понадобится для полной работы панели.</div>':'<div class="note g" style="margin-top:10px">Всё готово.</div>'}`}`}
  if(i===1){if(inf.pw){body='<div class="note">Пароль на панель уже задан. Сменить или снять его можно в «Настройки → Пароль».</div>'}
    else body=`<p class="note">Пароль защищает панель от других устройств в домашней сети. Он необязателен.</p>
    <div class="fg"><label>Пароль<input class="in" type="password" id="wzPw" value="${esc(WZ.pw)}" ${WZ.pwLater?'disabled':''} autocomplete="new-password"></label><label>Ещё раз<input class="in" type="password" id="wzPw2" value="${esc(WZ.pw2)}" ${WZ.pwLater?'disabled':''} autocomplete="new-password"></label></div>
    <label class="svc-i" style="margin-top:10px"><input type="checkbox" id="wzPwLater" ${WZ.pwLater?'checked':''}> Установлю пароль позже в настройках</label>
    <div class="note b" id="wzPwErr" style="margin-top:6px"></div>`}
  if(i===2){const j=WZ.job,run=j&&j.running;const X=wzWorking(j),Y=j?j.total:0;
    body=`<p class="note">Вставьте ссылку на подписку от вашего VPN-сервиса или ссылки на серверы (по одной в строке).</p>

vless://uuid@host:443?type=tcp&security=reality&…#🇩🇪 Германия
trojan://pass@host:443#🇳🇱 Нидерланды
ss://…  или  vmess://…">${esc(WZ.input)}</textarea>
    <div class="tools" style="margin-top:8px"><button class="btn pri" id="wzCheck" ${run?'disabled':''}>Проверить</button><span class="note">или</span><button class="btn" id="wzXkeen" ${run?'disabled':''}>У меня уже есть серверы в XKeen</button></div>
    <div class="note" style="margin-top:4px">Ничего вводить не нужно — панель возьмёт серверы, которые уже работают в вашем XKeen, и сразу их проверит.</div>

    ${j&&!run?`<div class="banner" style="margin-top:10px">Если серверы не работают или работают не все — напишите в поддержку вашего VPN-сервиса. Ссылку на подписку можно поменять потом: «Настройки → Подписка».</div>`:''}`;
    next=!run;}
  if(i===3){const svcs=(RUL&&RUL.services)||[];body=`<p class="note">Что пустить через VPN, а что — всегда через обычный интернет. Всё остальное будет открываться как обычно, без VPN. Поменять можно потом в разделе «Правила».</p>
    <div class="grid g2"><div><h3 style="margin:6px 0">Через VPN</h3><div id="wzVPN">${catalogHTML(svcs,['popular','social','ai','media','work','games','other'],WZ.vpn)}</div></div>

  if(i===4){const p=WZ.pick,run=p&&p.running;body=`<p class="note">Панель проверит все серверы на сервисах и скорости и выберет 6 разных лучших — по возможности из разных стран. Это займёт 1–2 минуты.</p>
    ${!p?'<button class="btn pri" id="wzPick">Подобрать серверы</button>':''}
    ${p?`<div>${run?`<span class="spin"></span> проверено ${p.done} из ${p.total}${p.done>=p.total?' · меряю скорость лучших…':''}`:p.err?`<span class="b">${esc(p.err)}</span>`:'<b class="g">Готово</b>'}<div class="prog" style="margin-top:6px"><i style="width:${p.total?Math.round(p.done*100/p.total):0}%"></i></div></div>`:''}
    ${p&&!run&&(p.picked||[]).length?`<div style="margin-top:12px"><b>Сторож будет держать эти серверы:</b>${(p.picked||[]).map(t=>{const r=(p.rows||[]).find(x=>x.tag===t)||{};return `<div class="row"><span>${srvName(t,true)}</span><span class="note mono">${r.ms||'—'} мс · сервисы ${r.okn}/6${r.kbps?' · '+mbps(r.kbps)+' Мбит/с':''}</span></div>`}).join('')}</div>`:''}
    ${p&&!run&&!(p.picked||[]).length?'<div class="banner" style="margin-top:10px">Не нашёл ни одного рабочего сервера. Можно идти дальше и настроить сторож позже.</div>':''}`;next=!run}
  if(i===5){const l=WZ.tun;body=`<p class="note">Если все серверы подписки перестанут работать, сторож переключится на подключение Keenetic (WireGuard, OpenVPN, прокси…). Отметьте, какие можно использовать.</p>
    ${!l?'<div class="empty"><span class="spin"></span></div>':l.length?`<table class="t">${l.map(t=>{const r=WZ.tunRes[t.name];return `<tr><td><input type="checkbox" class="wzTun" value="${esc(t.name)}" ${WZ.tunSel.has(t.name)?'checked':''}></td><td><b>${esc(t.type)} · ${esc(t.id||t.name)}</b>${t.desc?' <span class="note">'+esc(t.desc)+'</span>':''}<div class="note">${t.up?'подключено':'не подключено'}</div></td><td>${r==='…'?'<span class="spin"></span>':r==='ok'?'<span class="g">✓ работает</span>':r?'<span class="b">✕ '+esc(r)+'</span>':''}</td></tr>`}).join('')}</table>`:'<div class="note">Подключений WireGuard / OpenVPN / прокси в Keenetic не найдено — шаг можно пропустить.</div>'}`}
  if(i===6){body=`<p class="note">Telegram-бот пришлёт сообщение, если VPN перестанет работать. Необязательно.</p>
    <ol class="note" style="line-height:1.7;padding-left:18px"><li>В Telegram откройте <b>@BotFather</b> → /newbot → получите токен.</li><li>Напишите своему боту /start (или добавьте его в семейную группу и напишите там /start).</li><li>Вставьте токен и нажмите «Подключить».</li></ol>
    <div class="tools"><input class="in" id="wzTok" placeholder="123456789:AA…" value="${esc(WZ.tgTok)}" style="flex:1;min-width:200px"><button class="btn pri" id="wzTg">Подключить</button><button class="btn" id="wzTgTest">Отправить тест</button></div>
    <div class="note" id="wzTgMsg" style="margin-top:6px">${WZ.tgMsg||''}</div>
    <label style="display:block;margin-top:10px" class="note">Что присылать<select class="in" id="wzLev" style="display:block;margin-top:4px"><option value="crit">Только аварии</option><option value="important">Важное (по умолчанию)</option><option value="all">Всё</option></select></label>`}
  if(i===7){const items=[];
    if(!inf.pw)items.push(WZ.pwLater||!WZ.pw?'Пароль — позже, в настройках':'Задать пароль на панель');
    if(WZ.source==='input')items.push('Записать серверы из '+((WZ.input.trim().startsWith('http')&&!WZ.input.trim().includes('\n'))?'подписки (и обновлять её автоматически)':'ваших ссылок'));
    items.push(`Правила: через VPN — ${WZ.vpn.size} сервисов, без VPN — ${WZ.novpn.size}`);
    if(WZ.picked.length)items.push('Сторож: '+WZ.picked.length+' серверов, включён');
    if(WZ.tunSel.size)items.push('Резерв: '+WZ.tunSel.size+' подключений Keenetic');
    items.push('Telegram: '+({crit:'только аварии',important:'важное',all:'всё'}[WZ.tgLevel]));
    body=WZ.finished?`<div style="text-align:center;padding:20px 0"><div style="font-size:42px">✅</div><h3>Готово!</h3><p class="note">Панель настроена. Всё можно поменять в любой момент.</p></div><pre class="log" style="max-height:30vh">${esc(WZ.log.join('\n'))}</pre>`
      :`<p class="note">Проверьте и нажмите «Применить». Каждое изменение конфига проверяется Xray, перед записью делается резервная копия; Xray перезапустится 2–3 раза (связь пропадёт на 5–10 секунд).</p><ul>${items.map(x=>`<li style="margin:4px 0">${esc(x)}</li>`).join('')}</ul>${WZ.log.length?`<pre class="log" style="max-height:30vh">${esc(WZ.log.join('\n'))}</pre>`:''}`;
    nextTxt=WZ.finished?'Закрыть':WZ.applying?'Применяю…':'Применить';next=!WZ.applying}
  box.innerHTML=`<div class="card wzcard"><div class="wzsteps">${WZ_STEPS.map((s,k)=>`<span class="${k===i?'on':k<i?'done':''}">${k+1}. ${s}</span>`).join('')}</div>
   <h3 style="font-size:18px;margin:12px 0 8px">${WZ_STEPS[i]}</h3><div class="wzbody">${body}</div>
   <div class="tools wzfoot"><button class="btn" data-wz="close">${WZ.finished?'':'Позже'}</button><span class="sp"></span>${i>0&&i<7&&!WZ.applying?'<button class="btn" data-wz="skip" title="Ничего не менять на этом шаге">Пропустить шаг</button>':''}${i>0&&!WZ.applying&&!WZ.finished?'<button class="btn" data-wz="back">Назад</button>':''}<button class="btn pri" data-wz="next" ${next?'':'disabled'}>${nextTxt}</button></div></div>`;
  fixIndeterminate(box);if(i===6)$('#wzLev').value=WZ.tgLevel;
}
async function wzApply(){WZ.applying=true;WZ.log=[];const L=t=>{WZ.log.push(t);wzDraw()};wzDraw();const inf=WZ.info||{};
  const step=async(name,fn)=>{L('… '+name);try{const r=await fn();WZ.log[WZ.log.length-1]='✓ '+name+(r?' — '+r:'');wzDraw();return true}catch(e){WZ.log[WZ.log.length-1]='✕ '+name+': '+e.message;wzDraw();return false}};
  if(!inf.pw&&!WZ.pwLater&&WZ.pw)await step('Пароль',async()=>{await api('/api/password',{old:'',new:WZ.pw});PW=null});
  if(WZ.source==='input')await step('Серверы',async()=>{const r=await api('/api/wizard',{action:'apply-servers',input:WZ.input});return `+${r.added}, −${r.removed}`});
  if(WZ.vpn.size||WZ.novpn.size)await step('Правила',async()=>{const r=await api('/api/rules',{action:'save',mode:1,vpn:[...WZ.vpn],novpn:[...WZ.novpn]});return r.nochange?'без изменений':''});
  await loadState();const g=mainGroup();
  if(WZ.picked.length&&g)await step('Сторож',async()=>{const c=(S.servers||[]).map(s=>s.tag);const l=WZ.picked.filter(t=>c.includes(t));if(!l.length)throw new Error('выбранных серверов нет в конфиге');
    await api('/api/watch',{group:g.tag,servers:l});await api('/api/watch',{group:g.tag,enabled:true});return l.length+' серверов'});
  if(WZ.tunSel.size)await step('Резерв',async()=>{await api('/api/reserve',{ifaces:[...WZ.tunSel],auto:false})});
  await step('Telegram',async()=>{const st=(await api('/api/watch')).settings||W.settings||{};await api('/api/watch',{settings:{...st,tgLevel:WZ.tgLevel,tgEvents:'all',wizardDone:true}})});
  await step('Мастер пройден',async()=>{await api('/api/wizard',{action:'done'})});
  WZ.applying=false;WZ.finished=true;wzDraw();loadState();loadRules()}
document.addEventListener('input',e=>{if(!WZ)return;const id=e.target.id;
  if(id==='wzPw')WZ.pw=e.target.value;if(id==='wzPw2')WZ.pw2=e.target.value;if(id==='wzIn')WZ.input=e.target.value;if(id==='wzTok')WZ.tgTok=e.target.value});
document.addEventListener('change',e=>{if(!WZ)return;const t=e.target;
  if(t.id==='wzPwLater'){WZ.pwLater=t.checked;if(t.checked){WZ.pw='';WZ.pw2=''}wzDraw();return}
  if(t.id==='wzLev'){WZ.tgLevel=t.value;return}
  if(t.classList.contains('wzTun')){t.checked?WZ.tunSel.add(t.value):WZ.tunSel.delete(t.value);return}
  if(t.closest('#wzVPN')){catalogClick(e,WZ.vpn,()=>{WZ.vpn.forEach(id=>WZ.novpn.delete(id));wzDraw()});return}
  if(t.closest('#wzNO')){catalogClick(e,WZ.novpn,()=>{WZ.novpn.forEach(id=>WZ.vpn.delete(id));wzDraw()});return}});
document.addEventListener('click',async e=>{if(!WZ)return;const b=e.target.closest('[data-wz],#wzCheck,#wzXkeen,#wzPick,#wzTg,#wzTgTest');if(!b)return;
  if(b.id==='wzCheck'||b.id==='wzXkeen'){WZ.source=b.id==='wzXkeen'?'xkeen':'input';WZ.pick=null;WZ.picked=[];
    try{await api('/api/wizard',{action:'check',source:WZ.source,input:WZ.input});WZ.job={running:true,done:0,total:0,rows:[]};wzDraw();wzPoll()}catch(err){WZ.job={err:err.message,rows:[]};wzDraw()}return}
  if(b.id==='wzPick'){try{await api('/api/wizard',{action:'pick',source:WZ.source||'xkeen'});WZ.pick={running:true,done:0,total:0};wzDraw();wzPoll()}catch(err){WZ.pick={err:err.message};wzDraw()}return}
  if(b.id==='wzTg'){WZ.tgMsg='<span class="spin"></span>';wzDraw();try{const r=await api('/api/telegram',{token:WZ.tgTok,action:'test'});WZ.tgMsg='<span class="g">✓ Подключено'+(r.chat?': '+esc(r.chat):'')+'</span>'}catch(err){WZ.tgMsg='<span class="b">'+esc(err.message)+'</span>'}wzDraw();return}
  if(b.id==='wzTgTest'){try{const r=await api('/api/telegram',{action:'sendtest'});WZ.tgMsg=r.ok?'<span class="g">✓ Тест отправлен — проверьте Telegram</span>':'<span class="b">'+esc(r.adminErr||r.groupErr||'не доставлено')+'</span>'}catch(err){WZ.tgMsg='<span class="b">'+esc(err.message)+'</span>'}wzDraw();return}
  const a=b.dataset.wz;
  if(a==='close'){if(WZ.applying)return;wzClose();return}
  if(a==='back'){wzGo(WZ.step-1);return}
  if(a==='skip'){const i=WZ.step;if(i===1){WZ.pwLater=true;WZ.pw=WZ.pw2=''}if(i===2){WZ.source=''}if(i===3){WZ.vpn.clear();WZ.novpn.clear()}if(i===4){WZ.picked=[];WZ.pick=null}if(i===5)WZ.tunSel.clear();wzGo(i+1);return}
  if(a==='next'){const i=WZ.step;
    if(i===1&&!(WZ.info||{}).pw&&!WZ.pwLater){if(!WZ.pw){$('#wzPwErr').textContent='Введите пароль или отметьте «Установлю пароль позже»';return}
      if(WZ.pw.length<6){$('#wzPwErr').textContent='Пароль — хотя бы 6 символов';return}if(WZ.pw!==WZ.pw2){$('#wzPwErr').textContent='Пароли не совпадают';return}}
    if(i===4&&WZ.pick&&!WZ.pick.running)WZ.picked=WZ.pick.picked||[];
    if(i===7){if(WZ.finished){wzClose();return}await wzApply();return}
    wzGo(i+1)}});

    if(b.dataset.x==='check'){out.textContent='проверяю…';try{await api('/api/xcfg',{name,content,check:true});out.innerHTML='<span class="g">✓ Xray принимает этот конфиг</span>'}catch(err){out.innerHTML='<span class="b">'+esc(err.message)+'</span>'}}
